/* Tarramainen kehäkello logon mukaan: kerma pohja, paksu tumma ääriviiva, vaihe täyttää ruudun värillään */
:root{
  --bg:#f6f3e4; --cream:#fbf7ea; --ink:#151c27; --muted:#4f5866;
  --page:#1c2d42; --glow:#33597a; --shade:#0a1018; --sky:#9ecdd3; --logo-sky:#a1cfd3; --sun:#f8d863; --pink:#f29a9d;
  --prep:var(--sun); --round:var(--pink); --rest:var(--sky);
  --marker:"Permanent Marker","Comic Sans MS",cursive;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --stroke:3px solid var(--ink); --pop:4px 5px 0 var(--shade);
  color-scheme:light;
}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 42%,var(--glow) 0,var(--page) 62%) fixed,var(--page);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none}
.screen{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;position:relative}
button{font-family:var(--body);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:5px}
button:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)!important}
.gear{position:absolute;top:12px;right:0;width:56px;height:56px;border-radius:18px;border:var(--stroke);background:var(--cream);box-shadow:var(--pop);display:grid;place-items:center;z-index:2}
.gear svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:2.2}
.oldlogo{width:min(44vw,190px);max-width:100%;aspect-ratio:1;border-radius:22%;display:block;box-shadow:var(--pop);border:var(--stroke)}
.start{position:relative;width:min(66vw,290px);aspect-ratio:1;max-width:100%;border-radius:50%;border:5px solid var(--ink);
  background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--cream) 40%,#e9e2cc 100%);box-shadow:6px 8px 0 var(--shade);
  font-family:var(--marker);font-size:clamp(40px,12vw,58px);letter-spacing:.02em;text-transform:uppercase}
.start span{position:relative;z-index:0}
.start span::after{content:"";position:absolute;left:-4%;right:-4%;bottom:-6px;height:10px;border-radius:6px;background:var(--pink);transform:rotate(-4deg);z-index:-1}
.summary{color:var(--muted);font-size:15px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}

#home .start span{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%) rotate(-3deg);font-family:var(--marker);font-size:clamp(28px,8vw,40px);
  background:var(--pink);border:var(--stroke);border-radius:16px;padding:2px 26px;box-shadow:var(--pop);white-space:nowrap}
#home .start span::after{display:none}
#home .summary{margin-top:30px}
.burst{position:relative;display:grid;place-items:center}
.burst::before{content:"";position:absolute;inset:-14%;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 8deg,var(--sun) 0 7deg,transparent 7deg 30deg);
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 59%,#000 70%,transparent 71%);mask:radial-gradient(circle,transparent 58%,#000 59%,#000 70%,transparent 71%);
  animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gear{right:auto;left:0}
.clock{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));height:56px;padding:0 16px;display:flex;align-items:center;border:var(--stroke);border-radius:18px;background:var(--cream);box-shadow:var(--pop);
  font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}

/* Käynnissä: koko ruutu vaiheen värissä, näkyy kauas */
#run{transition:background .4s;background:var(--ph);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#run[data-phase="prep"]{--ph:var(--prep)} #run[data-phase="round"]{--ph:var(--round)} #run[data-phase="rest"]{--ph:var(--rest)}
.phase{font-family:var(--marker);font-size:clamp(38px,12vw,58px);text-transform:uppercase;line-height:1;
  color:var(--cream);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 4px 0 var(--ink)}
.roundno{color:var(--ink);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;min-height:24px}
.dial{position:relative;width:min(82vw,370px);aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--cream);border:5px solid var(--ink);box-shadow:6px 8px 0 var(--shade)}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .track{stroke:#e6dfc8} .dial .prog{stroke:var(--ink);transition:stroke-dashoffset .2s linear}
.time{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;
  font-size:clamp(72px,23vw,124px);font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
.dial.pulse{animation:shake .32s ease-out}
#run.final .time{color:#c8343a}
@keyframes shake{0%{transform:scale(1)}35%{transform:scale(1.06)}100%{transform:scale(1)}}
.controls{display:flex;gap:16px;width:min(100%,420px)}
.controls button{flex:1;height:84px;border-radius:22px;border:var(--stroke);background:var(--cream);box-shadow:var(--pop);font-size:22px;font-weight:700}
.controls .primary{background:var(--ink);color:var(--cream)}

/* Asetukset */
#settings{justify-content:flex-start;padding-block:16px;overflow-y:auto;gap:14px}
.shead{width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;min-height:60px}
.shead h1{font-family:var(--marker);font-weight:400;font-size:32px;margin:0;color:var(--cream)}
.close{width:100%;max-width:440px;flex-shrink:0;height:64px;margin-block:6px 18px;border-radius:22px;font-size:22px!important;border:var(--stroke);background:var(--pink);box-shadow:var(--pop);font-size:18px;font-weight:700}
.row{width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--cream);border:var(--stroke);border-radius:18px;box-shadow:3px 4px 0 var(--shade)}
.row .lbl{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .lbl b{font-size:17px}
.row .lbl small{color:var(--muted);font-size:13px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:0;border:2px solid var(--ink)}
.step{display:flex;align-items:center;gap:6px;flex-shrink:0}
.step button{width:46px;height:46px;border-radius:50%;border:var(--stroke);background:var(--sky);box-shadow:2px 3px 0 var(--shade);font-size:24px;font-weight:700;line-height:1}
.step output{min-width:62px;text-align:center;font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.test{width:100%;max-width:440px;display:flex;gap:10px}
.test button{flex:1;min-height:48px;padding:6px;border-radius:14px;border:var(--stroke);background:var(--sun);box-shadow:3px 4px 0 var(--shade);font-size:14px;font-weight:700}
.note{max-width:440px;color:var(--sky);font-size:13px;line-height:1.5;text-align:center}
.watermark{font-family:var(--marker);font-size:18px;letter-spacing:.04em;color:var(--sky);opacity:.55;transform:rotate(-3deg);margin:10px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="clock" id="clock" aria-label="Kellonaika">--:--</div>
<section class="screen" id="home">
  <button class="gear" id="openSettings" aria-label="Asetukset">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  <div class="burst"><button class="start" id="startBtn" aria-label="Aloita"><span>Aloita</span></button></div>
  <div class="summary" id="summary"></div>
</section>

<section class="screen" id="run" hidden data-phase="prep">
  <div class="phase" id="phaseName">Valmistaudu</div>
  <div class="roundno" id="roundNo"></div>
  <div class="dial">
    <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46" fill="none" stroke-width="4"/>
      <circle class="prog" id="prog" cx="50" cy="50" r="46" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="289.03" stroke-dashoffset="0"/></svg>
    <div class="time" id="time">1:00</div>
  </div>
  <div class="controls">
    <button id="stopBtn">Lopeta</button>
    <button class="primary" id="pauseBtn">Tauko</button>
  </div>
</section>

<section class="screen" id="settings" hidden>
  <div class="shead"><h1>Asetukset</h1></div>
  <div id="rows" style="display:contents"></div>
  <div class="test"><button id="t1">Kokeile DING</button><button id="t2">Kokeile laskenta</button><button id="t3">Kokeile DING DING</button></div>
  <p class="note watermark">Made by Antti Kääriäinen</p>
  <button class="close" id="closeSettings">Valmis</button>
</section>

<script>
(function(){
const DEF={prep:60,round:120,rest:120,rounds:6,count:5};
let S=Object.assign({},DEF);
try{const s=JSON.parse(localStorage.getItem('dingding')||localStorage.getItem('kehakello')||'null');if(s)S=Object.assign(S,s)}catch(e){}
if(S.rest<10)S.rest=10;S.rest=Math.round(S.rest/10)*10;
const save=()=>{try{localStorage.setItem('dingding',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

/* ---- Äänet: syntetisoidaan WAV-tiedostoiksi, soitetaan audio-elementillä (antaa puhelimelle mahdollisuuden hiljentää musiikkia) ---- */
const RATE=22050;
function bell(buf,start,freq,gain,dur){
  const parts=[[1,1],[2.76,.45],[5.4,.25],[8.93,.12]];
  const n0=Math.floor(start*RATE),n=Math.floor(dur*RATE);
  for(let i=0;i<n&&n0+i<buf.length;i++){const t=i/RATE;let v=0;
    for(const[m,a]of parts)v+=a*Math.sin(2*Math.PI*freq*m*t)*Math.exp(-t*(2.2+m*.9));
    buf[n0+i]+=v*gain*Math.min(1,i/40)}
}
function beep(buf,start,freq,gain,dur){
  const n0=Math.floor(start*RATE),n=Math.floor(dur*RATE);
  for(let i=0;i<n;i++){const t=i/RATE;buf[n0+i]+=gain*Math.sin(2*Math.PI*freq*t)*Math.min(1,i/60)*Math.min(1,(n-i)/400)}
}
function toWav(buf){
  let peak=0;for(const v of buf)peak=Math.max(peak,Math.abs(v));const k=peak>0?.95/peak:1;
  const dv=new DataView(new ArrayBuffer(44+buf.length*2));const w=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');dv.setUint32(4,36+buf.length*2,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,RATE,true);dv.setUint32(28,RATE*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,buf.length*2,true);
  for(let i=0;i<buf.length;i++)dv.setInt16(44+i*2,Math.max(-1,Math.min(1,buf[i]*k))*32767,true);
  return URL.createObjectURL(new Blob([dv],{type:'audio/wav'}));
}
const snd={};
(function build(){
  let b=new Float32Array(RATE*2.2);bell(b,0,880,1,2.2);snd.ding=toWav(b);
  b=new Float32Array(RATE*3);bell(b,0,830,1,2.4);bell(b,.45,830,1,2.5);snd.double=toWav(b);
  b=new Float32Array(Math.floor(RATE*.25));beep(b,0,1568,1,.18);snd.tick=toWav(b);
})();
let actx=null;
function fallback(kind){ // jos audio-elementti ei soi, Web Audio varalla
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();
    o.frequency.value=kind==='tick'?1568:880;o.connect(g);g.connect(actx.destination);const t=actx.currentTime;
    g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.001,t+(kind==='tick'?.2:1.5));o.start(t);o.stop(t+1.6)}catch(e){}
}
const N=window.DingNative||null;
const playing=new Set();
function play(kind){
  if(N){try{N.play(kind);return}catch(e){}}
  try{const a=new Audio(snd[kind]);a.volume=1;playing.add(a);a.onended=()=>playing.delete(a);
    const p=a.play();if(p&&p.catch)p.catch(()=>{playing.delete(a);fallback(kind)})}catch(e){fallback(kind)}
}
function silence(){if(N){try{N.stop()}catch(e){}}playing.forEach(a=>{try{a.pause();a.src=''}catch(e){}});playing.clear()}
let testTimer=null;
function stopTest(){clearTimeout(testTimer);testTimer=null;silence()}
function unlock(){try{const a=new Audio(snd.tick);a.volume=0;a.play().catch(()=>{})}catch(e){}}

/* ---- Näytön pito päällä ---- */
let lock=null;
async function wake(){try{if('wakeLock' in navigator&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}}catch(e){}}
function sleep(){try{lock&&lock.release()}catch(e){}lock=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state!=='idle')wake()});

/* ---- Ajastinlogiikka ---- */
const NAMES={prep:'Valmistaudu',round:'Erä',rest:'Tauko'};
let state='idle',phase='prep',round=0,dur=0,endAt=0,remainPaused=0,lastSec=null,timer=null;
function begin(p){
  phase=p;dur=S[p];endAt=performance.now()+dur*1000;lastSec=null;
  if(p==='round')round++;
  $('run').dataset.phase=p;$('phaseName').textContent=NAMES[p];
  $('roundNo').textContent=round?('Erä '+round+(S.rounds?' / '+S.rounds:'')):'';
}
function next(){
  if(phase==='prep'){play('ding');begin('round');return}
  if(phase==='round'){
    play('double');
    if(S.rounds&&round>=S.rounds){finish();return}
    begin('rest');return}
  if(phase==='rest'){play('double');begin('round')}
}
function loop(){
  if(state!=='running')return;
  const left=(endAt-performance.now())/1000;
  const sec=Math.ceil(left);
  if(left<=0){next();if(state!=='running')return;render(dur);return}
  if(sec!==lastSec){
    if(lastSec!==null&&sec>=1&&sec<=S.count){play('tick');pulse()}
    lastSec=sec}
  render(left);
}
function pulse(){const d=document.querySelector('.dial');d.classList.remove('pulse');void d.offsetWidth;d.classList.add('pulse')}
function render(left){
  $('time').textContent=fmt(left);
  $('prog').style.strokeDashoffset=(289.03*(1-left/dur)).toFixed(2);
  $('run').classList.toggle('final',left<=S.count);
}
function start(){
  unlock();state='running';round=0;
  $('home').hidden=true;$('run').hidden=false;$('pauseBtn').textContent='Tauko';
  begin(S.prep>0?'prep':'round');if(phase==='round'&&S.prep===0)play('ding');
  render(dur);clearInterval(timer);timer=setInterval(loop,50);wake();
}
function togglePause(){
  if(state==='running'){state='paused';remainPaused=endAt-performance.now();$('pauseBtn').textContent='Jatka'}
  else if(state==='paused'){state='running';endAt=performance.now()+remainPaused;$('pauseBtn').textContent='Tauko'}
}
function stop(){state='idle';silence();clearInterval(timer);sleep();$('run').hidden=true;$('home').hidden=false;summary()}
function finish(){
  state='done';clearInterval(timer);
  $('phaseName').textContent='Valmis!';$('time').textContent='0:00';$('roundNo').textContent=S.rounds+' erää tehty';
  $('prog').style.strokeDashoffset='289.03';$('pauseBtn').textContent='Uudestaan';
}
$('startBtn').onclick=start;
$('pauseBtn').onclick=()=>{if(state==='done')start();else togglePause()};
$('stopBtn').onclick=stop;

/* ---- Asetukset ---- */
const ROWS=[
  {k:'prep',t:'Valmistautuminen',d:'Aika ennen ensimmäistä erää',c:'var(--prep)',step:10,min:0,max:600,time:true},
  {k:'round',t:'Erän pituus',d:'Loppuu DING DING -ääneen',c:'var(--round)',step:10,min:10,max:1200,time:true},
  {k:'rest',t:'Tauon pituus',d:'Erien välissä',c:'var(--rest)',step:10,min:10,max:1200,time:true},
  {k:'rounds',t:'Erien määrä',d:'0 = jatkuu kunnes lopetat',step:1,min:0,max:50},
  {k:'count',t:'Loppulaskenta',d:'Piippaus joka sekunti lopussa',step:1,min:0,max:15,suffix:' s'}
];
function show(r){return r.time?fmt(S[r.k]):(r.k==='rounds'&&S[r.k]===0?'∞':S[r.k]+(r.suffix||''))}
function buildRows(){
  const box=$('rows');box.innerHTML='';
  ROWS.forEach(r=>{
    const el=document.createElement('div');el.className='row';
    el.innerHTML='<div class="lbl"><b>'+(r.c?'<span class="dot" style="background:'+r.c+'"></span>':'')+r.t+'</b><small>'+r.d+'</small></div>'+
      '<div class="step"><button id="m_'+r.k+'" aria-label="Vähennä">−</button><output id="o_'+r.k+'">'+show(r)+'</output><button id="p_'+r.k+'" aria-label="Lisää">+</button></div>';
    box.appendChild(el);
    const ch=d=>{let st=r.step;if(r.time&&(d>0?S[r.k]>=120:S[r.k]>120))st=30;
      let v=S[r.k]+d*st;v=Math.round(v/r.step)*r.step;
      S[r.k]=Math.min(r.max,Math.max(r.min,v));$('o_'+r.k).textContent=show(r);save()};
    el.querySelector('#m_'+r.k).onclick=()=>ch(-1);el.querySelector('#p_'+r.k).onclick=()=>ch(1);
  });
}
function summary(){$('summary').textContent=(S.rounds?S.rounds+' erää':'Jatkuva')+' · erä '+fmt(S.round)+' · tauko '+fmt(S.rest)}
$('openSettings').onclick=()=>{buildRows();$('home').hidden=true;$('settings').hidden=false};
$('closeSettings').onclick=()=>{stopTest();$('settings').hidden=true;$('home').hidden=false;summary()};
$('t1').onclick=()=>{stopTest();play('ding')};
$('t3').onclick=()=>{stopTest();play('double')};
$('t2').onclick=()=>{stopTest();let i=0;const f=()=>{play('tick');testTimer=++i<5?setTimeout(f,1000):null};f()};
summary();
window.dingBack=function(){
  if(!$('settings').hidden){$('closeSettings').click();return true}
  if(state!=='idle'){stop();return true}
  return false};
function tickClock(){const d=new Date();$('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
tickClock();setInterval(tickClock,1000);
})();
</script>

if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
