name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Luo Android-projekti
        run: python3 build_android.py

      - name: Allekirjoitusavain (jos lisätty Secrets-kohtaan)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          KS="$RUNNER_TEMP/dingding.jks"
          # poistetaan välilyönnit ja rivinvaihdot, joita liittäessä tarttuu mukaan
          CLEAN=$(printf '%s' "$KS_B64" | tr -d ' \r\n\t')
          if [ -n "$CLEAN" ] && printf '%s' "$CLEAN" | base64 -d > "$KS" 2>/dev/null \
             && keytool -list -keystore "$KS" -storepass "$KS_PASS" >/dev/null 2>&1; then
            echo "KS_FILE=$KS" >> "$GITHUB_ENV"
            echo "Käytetään omaa avainta"
          else
            echo "::warning::Omaa avainta ei saatu luettua (tarkista KEYSTORE_B64 ja KEYSTORE_PASS) – käytetään väliaikaista avainta"
            rm -f "$KS"
          fi

      - name: Käännä APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Nimeä APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DINGDING.apk

      - name: Julkaise Releases-sivulle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DING DING 1.0.${{ github.run_number }}
          body: Lataa DINGDING.apk puhelimeen ja asenna.
          files: DINGDING.apk
