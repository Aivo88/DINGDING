name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Luo Android-projekti
        run: python3 build_android.py

      - name: Allekirjoitusavain (jos lisätty Secrets-kohtaan)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dingding.jks"
            echo "KS_FILE=$RUNNER_TEMP/dingding.jks" >> "$GITHUB_ENV"
            echo "Käytetään omaa avainta"
          else
            echo "Avainta ei ole – käytetään väliaikaista debug-avainta"
          fi

      - name: Käännä APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Nimeä APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DINGDING.apk

      - name: Julkaise Releases-sivulle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DING DING 1.0.${{ github.run_number }}
          body: Lataa DINGDING.apk puhelimeen ja asenna.
          files: DINGDING.apk
